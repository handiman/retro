# Dependabot version updates (security alerts work without this file; this adds
# scheduled PRs that keep dependencies current so alerts have less to catch).
# See https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # github-pages pins jekyll-remote-theme 0.4.3, which needs rubyzip < 3.0, so rubyzip 3.x
      # cannot be installed. The site does not use remote_theme. Drop this once github-pages
      # ships a jekyll-remote-theme that supports rubyzip 3.
      - dependency-name: rubyzip
        update-types: ["version-update:semver-major"]
    groups:
      # One PR for all routine bumps instead of one per package.
      minor-and-patch:
        update-types:
          - minor
          - patch
      # Security fixes grouped the same way, kept apart from routine bumps.
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
